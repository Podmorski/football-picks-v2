name: Update data

on:
  schedule:
    # Tuesday and Friday evenings, plus a Saturday morning retry, all UTC.
    # Publishing is idempotent: a round file is only created when fixtures exist,
    # later runs just settle results.
    - cron: '0 14 * * 2'
    - cron: '0 16 * * 2'
    - cron: '0 18 * * 5'
    - cron: '0 21 * * 5'
    - cron: '0 8 * * 6'
    # Monday: settle only, never publish a new round.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Past-season files are downloaded once and reused; only the current season is refetched.
      - name: Restore raw CSV cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: picks-raw-v1-${{ github.run_id }}
          restore-keys: |
            picks-raw-v1-

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Download results and fixtures
        run: python -m pipeline.run

      - name: Build model and publish rounds
        run: python -m pipeline.run_model

      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data picks pipeline/model/decisions.json
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Vercel's git integration cannot be relied on for commits authored by
      # github-actions[bot], so fire the deploy hook explicitly when data changed.
      - name: Trigger Vercel deploy hook
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK secret set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Deploy hook triggered."
