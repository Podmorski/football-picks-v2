name: Update data

on:
  schedule:
    # Retries so publishing never depends on one slot; publishing is idempotent.
    - cron: '0 10 * * 2'
    - cron: '0 14 * * 2'
    - cron: '0 16 * * 2'
    - cron: '0 15 * * 5'
    - cron: '0 18 * * 5'
    - cron: '0 21 * * 5'
    - cron: '0 5 * * 6'
    - cron: '0 8 * * 6'
    - cron: '0 5 * * 0'
    - cron: '0 8 * * 0'
    # Next-day settle-only retries. All are outside the documented push guards.
    - cron: '0 12 * * 0'
    - cron: '0 18 * * 0'
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 3'
    - cron: '0 12 * * 3'
    # Monday: settle only, never publish a new round (settles both weekend rounds).
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Past-season files are downloaded once and reused; only the current season is refetched.
      - name: Restore raw CSV cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: picks-raw-v1-${{ github.run_id }}
          restore-keys: |
            picks-raw-v1-

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Select settle-only retry mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * 0"|"0 18 * * 0"|"0 6 * * 1"|"0 6 * * 3"|"0 12 * * 3")
              echo "settle_only=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "settle_only=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Download results and fixtures
        run: python -m pipeline.run

      - name: Restore API-Football fallback cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/api_football
            data/raw/api_football_usage.json
          key: api-football-${{ github.run_id }}
          restore-keys: |
            api-football-

      - name: Fetch next-day result fallback
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m pipeline.api_football ensure

      - name: Build model and publish rounds
        if: steps.mode.outputs.settle_only != 'true'
        run: python -m pipeline.run_model

      - name: Settle every eligible past round
        if: steps.mode.outputs.settle_only == 'true'
        run: python -m pipeline.run_model --settle-only --skip-backtest --skip-picker-backtest

      - name: Checkout private prices repo
        uses: actions/checkout@v4
        with:
          repository: Podmorski/football-picks-prices
          ssh-key: ${{ secrets.PRICES_DEPLOY_KEY }}
          path: prices-private

      - name: Build value record
        run: python -m pipeline.mozzart.value_record --prices-dir prices-private --web-dir web/public/data

      - name: Settle proposals and rebuild public aggregate
        run: python -m pipeline.proposed_tickets aggregate --prices-dir prices-private --picks-dir picks --web-dir web/public/data

      - name: Update retrospective ticket settlements
        run: python -m pipeline.retrospective_tickets settle --picks-dir picks --output web/public/data/retrospective-tickets.json

      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data picks pipeline/model/decisions.json
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Vercel's git integration cannot be relied on for commits authored by
      # github-actions[bot], so fire the deploy hook explicitly when data changed.
      - name: Trigger Vercel deploy hook
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK secret set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Deploy hook triggered."
