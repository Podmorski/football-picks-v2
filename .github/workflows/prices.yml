name: Prices

# A separate workflow so a price failure can never block publishing or settling.
# Late-tolerant slots; each run fetches only if the round has no snapshot yet.
# Fixtures kicking off within 20 minutes of the fetch are marked started and not
# priced. A `complete` dispatch merges a completion fetch into the existing snapshot.
on:
  schedule:
    # Late-tolerant slots. Each run fetches only if the round has no snapshot
    # yet; otherwise it exits with 0 requests. Fixtures kicking off within 20
    # minutes of the fetch are marked started and not priced.
    - cron: '0 5 * * 6'
    - cron: '30 6 * * 6'
    - cron: '0 8 * * 6'
    - cron: '30 9 * * 6'
    - cron: '0 5 * * 0'
    - cron: '30 6 * * 0'
    - cron: '0 8 * * 0'
    - cron: '30 9 * * 0'
    - cron: '0 13 * * 2'
    - cron: '30 14 * * 2'
    - cron: '0 16 * * 2'
    - cron: '30 17 * * 2'
  workflow_dispatch:
    inputs:
      date:
        description: Round date (YYYY-MM-DD); blank = today
        required: false
      complete:
        description: "Completion fetch: merge into an existing snapshot"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Checkout private prices repo
        uses: actions/checkout@v4
        with:
          repository: Podmorski/football-picks-prices
          ssh-key: ${{ secrets.PRICES_DEPLOY_KEY }}
          path: prices

      - name: Fetch one pass and freeze the snapshot
        env:
          PULSESCORE_API_KEY: ${{ secrets.PULSESCORE_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            if [ "${{ github.event.inputs.complete }}" = "true" ]; then
              python -m pipeline.mozzart.cli --date "${{ github.event.inputs.date }}" --prices-dir prices --complete
            else
              python -m pipeline.mozzart.cli --date "${{ github.event.inputs.date }}" --prices-dir prices
            fi
          else
            python -m pipeline.mozzart.cli --prices-dir prices
          fi

      - name: Commit the private snapshot
        id: commit
        if: always()
        run: |
          git -C prices config user.name "github-actions[bot]"
          git -C prices config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C prices add -A
          if git -C prices diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -C prices commit -m "prices: snapshot"
            git -C prices push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger priced rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Deploy hook triggered."
